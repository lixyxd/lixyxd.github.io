<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面未找到</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0a101f; color:#dbe4f3; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; text-align:center;}
  .box{max-width:420px; padding:30px;}
  .code{font-size:80px; font-weight:800; background:linear-gradient(135deg,#38bdf8,#a78bfa);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin:0;}
  h1{font-size:18px; margin:10px 0;}
  p{color:#8fa3c8; font-size:13px;}
  a{display:inline-block; margin-top:18px; padding:9px 22px; border-radius:9px; text-decoration:none;
    background:linear-gradient(135deg,#38bdf8,#2563eb); color:#04121f; font-weight:600; font-size:14px;}
  a:hover{filter:brightness(1.12);}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>页面未找到 · Page Not Found</h1>
    <p>你要找的页面不存在，或者它正在雷达成像处理中……</p>
    <a href="./">返回主页 · Back to Home</a>
  </div>
</body>
</html>
